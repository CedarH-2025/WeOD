<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foo VOD System</title>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; }
        
        /* top bar */
        .navbar {
            background: linear-gradient(90deg, #00acc1, #007c91);
            color: white;
            padding: 10px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .navbar h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* search bar*/
        .search-section {
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        #videoInput {
            width: 70%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        #playBtn {
            padding: 12px 24px;
            background-color: #00acc1;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-left: 10px;
        }
        #playBtn:hover { background-color: #007c91; }

        /* metric choose bar */
        .options-section {
        margin-top: 15px;
        display: flex;
        justify-content: center;
        gap: 20px;
        max-width: 800px;
        }
        .option-group { display: flex; align-items: center; }
        .label-text { font-size: 14px; color: #555; margin-right: 8px; font-weight: bold; }
        select { padding: 6px 10px; border-radius: 4px; border: 1px solid #00acc1; }

        /* dash player */
        .video-wrapper {
            width: 100%;
            max-width: 800px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        video { width: 100%; display: block; }
    </style>
    
</head>
<body>

    <div class="navbar">
        <h1>Foo</h1>
    </div>

    <div class="container">

        <div class="search-section">
            <input type="text" id="videoInput" placeholder="Search a video to play! example: test_video">
            <button id="playBtn" onclick="handleSearch()">Play</button>

            <div class="options-section">
                <div class="option-group">
                    <span class="label-text">Codec:</span>
                    <select id="codecSelect">
                        <option value="libx264">H.264 (AVC)</option>
                        <option value="libx265">H.265 (HEVC)</option>
                        <option value="libvpx-vp9">VP9</option>
                    </select>
                </div>
                <div class="option-group">
                    <span class="label-text">FPS:</span>
                    <select id="fpsSelect">
                        <option value="24">24</option>
                        <option value="30">30</option>
                        <option value="60">60</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="statusText">
        </div>

        <div class="video-wrapper">
            <video id="videoPlayer" controls></video>
        </div>
        <!-- stats test-->
        <div id="stats"></div>
    </div>

    <script>
        let player = dashjs.MediaPlayer().create();
        const videoElement = document.querySelector("#videoPlayer");
        const stats = document.getElementById("stats");
        const statusText = document.getElementById("statusText");

        let currentLogId = null;
        let requestStartTime = null;
        let firstPlayingTime = null;

        let bufferSamples = [];
        let sampleTimer = null;

        function getBufferLevel(video) {
            if (video.buffered.length > 0) {
                return video.buffered.end(video.buffered.length - 1) - video.currentTime;
            }
            return 0;
        }

        function getDecodedFrames(video) {
            return video.webkitDecodedFrameCount ?? 0;
        }

        function getDroppedFrames(video) {
            return video.webkitDroppedFrameCount ?? 0;
        }

        function startSampling() {
            bufferSamples = [];

            if (sampleTimer !== null) {
                clearInterval(sampleTimer);
            }

            sampleTimer = setInterval(() => {
                const bufferLevel = getBufferLevel(videoElement);
                bufferSamples.push(bufferLevel);

                stats.innerText = `
                    currentTime: ${videoElement.currentTime.toFixed(2)}
                    paused: ${videoElement.paused}
                    readyState: ${videoElement.readyState}
                    decodedFrames: ${getDecodedFrames(videoElement)}
                    droppedFrames: ${getDroppedFrames(videoElement)}
                    bufferLevel: ${bufferLevel.toFixed(2)}
                    samples: ${bufferSamples.length}
                                `;
            }, 2000);
        }

        function stopSampling() {
            if (sampleTimer !== null) {
                clearInterval(sampleTimer);
                sampleTimer = null;
            }
        }

        function getAverageBufferLevel() {
            if (bufferSamples.length === 0) {
                return 0;
            }

            const total = bufferSamples.reduce((sum, value) => sum + value, 0);
            return total / bufferSamples.length;
        }

        function getFrontendSummary() {
            const decodedFrames = getDecodedFrames(videoElement);
            const droppedFrames = getDroppedFrames(videoElement);

            const dropRate = decodedFrames > 0
                ? droppedFrames / decodedFrames
                : 0;

            return {
                log_id: currentLogId,
                start_up_delay: firstPlayingTime !== null && requestStartTime !== null
                    ? firstPlayingTime - requestStartTime
                    : null,
                avg_buffer_level: getAverageBufferLevel(),
                decoded_frames: decodedFrames,
                dropped_frames: droppedFrames,
                drop_rate: dropRate
            };
        }

        async function sendFrontendSummary() {
            if (!currentLogId) {
                console.log("No log_id, skip frontend summary.");
                return;
            }

            stopSampling();

            const summary = getFrontendSummary();
            console.log("frontend summary:", summary);

            // backend method will be added later
            await fetch("/api/log_frontend", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(summary)
            });
        }

        async function handleSearch() {
            const videoTitle = document.getElementById('videoInput').value;
            const codec = document.getElementById('codecSelect').value;
            const fps = document.getElementById('fpsSelect').value;

            if (!videoTitle) {
                alert("Please input a title!");
                return;
            }

            try {
                requestStartTime = performance.now();
                firstPlayingTime = null;
                currentLogId = null;
                bufferSamples = [];

                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: videoTitle,
                        codec: codec,
                        fps: fps
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    statusText.innerText = "Success, starting to play";

                    currentLogId = result.log_id;

                    player.initialize(videoElement, result.url, true);
                    startSampling();
                } else {
                    statusText.innerText = `Failed: ${result.error || 'Unknown error'}`;
                }
            } catch (error) {
                statusText.innerText = `Failed: ${result.error || 'Unknown error'}`;
            }
        }

        videoElement.addEventListener("playing", () => {
            if (firstPlayingTime === null) {
                firstPlayingTime = performance.now();
                console.log("start-up delay:", firstPlayingTime - requestStartTime);
            }
        });

        videoElement.addEventListener("ended", () => {
            sendFrontendSummary();
        });

        videoElement.addEventListener("error", () => {
            stopSampling();
        });
    </script>
</body>
</html>
